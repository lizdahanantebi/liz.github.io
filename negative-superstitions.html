<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superstitions SC-IAT</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #canvas { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="canvas"></div>
    <input type="hidden" id="hidden-data" tabindex="-1" autocomplete="off" />

    <script src="https://cdn.jsdelivr.net/gh/minnojs/minno-quest@0.3/dist/pi-minno.js"></script>
    <script>
        window.onload = function() {
            var canvas = document.getElementById('canvas');
            document.getElementById('hidden-data').setAttribute('tabindex', '-1');
            document.body.setAttribute('tabindex', '-1');
            canvas.setAttribute('tabindex', '-1');
            if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
            canvas.focus();
            setTimeout(function() {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
                canvas.focus();
            }, 400);

            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.keyCode === 32) e.preventDefault();
            }, true);

            minnoJS(canvas, 'https://lizdahanantebi.github.io/liz.github.io/negative-superstitions.js');

            var isEmbedded = (window.parent !== window.self) || (window.location.search.indexOf('embed=1') !== -1);

            function notifyQualtrics(payload) {
                try {
                    if (window.parent && window.parent !== window.self) {
                        window.parent.postMessage(payload, '*');
                    }
                } catch (e) {}
            }

            setTimeout(function applyPostMessageWrapper() {
                var origLogger = minnoJS.logger;
                var origOnEnd = minnoJS.onEnd;

                minnoJS.logger = function(value) {
                    if (origLogger) try { origLogger(value); } catch (e) {}
                    try {
                        document.getElementById('hidden-data').value = typeof value === 'string' ? value : JSON.stringify(value);
                        localStorage.setItem('stiat_negative_data', document.getElementById('hidden-data').value);
                    } catch (e2) {}
                    notifyQualtrics({ data: value });
                };

                minnoJS.onEnd = function() {
                    if (origOnEnd) try { origOnEnd(); } catch (e) {}
                    notifyQualtrics({
                        name: 'stiatComplete',
                        data: document.getElementById('hidden-data').value,
                        done: true
                    });
                    if (!isEmbedded) {
                        alert("Thank you! You have completed the task. The data has been saved. Please close this window and return to the survey.");
                    }
                };
            }, 150);
        };
    </script>
</body>
</html>
